<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compose Auto Updater</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #0f1115; color: #e6e6e6; }
  header { padding: 16px 24px; background: #171a21; border-bottom: 1px solid #2a2f3a; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  .muted { color: #8b93a3; font-size: 13px; }
  main { padding: 24px; max-width: 1100px; margin: 0 auto; }
  section { background: #171a21; border: 1px solid #2a2f3a; border-radius: 10px; padding: 18px; margin-bottom: 20px; }
  h2 { font-size: 15px; margin: 0 0 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #232833; vertical-align: top; }
  th { color: #9aa3b2; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: none; }
  code { background: #0b0d12; padding: 2px 6px; border-radius: 5px; font-size: 12.5px; }
  input[type=text], input[type=number] { width: 100%; padding: 7px 9px; background: #0b0d12; color: #e6e6e6; border: 1px solid #2a2f3a; border-radius: 6px; font-family: inherit; }
  button { padding: 8px 14px; border-radius: 7px; border: 1px solid #2f6feb; background: #2f6feb; color: #fff; font-weight: 600; cursor: pointer; font-family: inherit; }
  button.secondary { background: transparent; color: #cbd3e0; border-color: #3a4150; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row > label { flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #9aa3b2; }
  .switch { display: inline-flex; align-items: center; gap: 8px; }
  .status { padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .status.updated { background: #17351f; color: #6ee7a0; }
  .status.unchanged { background: #2a2f3a; color: #b8c0cf; }
  .status.skipped { background: #33301a; color: #e6d78a; }
  .status.failed { background: #3a1c1c; color: #f0a1a1; }
  .status.pulled { background: #1c2a3a; color: #8fc4f0; }
  .actions { display: flex; gap: 10px; align-items: center; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #1f2530; border: 1px solid #2a2f3a; padding: 12px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Compose Auto Updater</h1>
  <span class="muted" id="meta"></span>
  <span style="flex:1"></span>
  <div class="actions">
    <button id="runBtn">Run now</button>
  </div>
</header>
<main>
  <section>
    <h2>Schedule &amp; scanning</h2>
    <div class="row">
      <label>Cron (minute hour dom mon dow)
        <input type="text" id="cron" placeholder="0 */6 * * *">
      </label>
      <label>Timezone
        <input type="text" id="tz" placeholder="Asia/Shanghai">
      </label>
      <label>Scan depth
        <input type="number" id="depth" min="0">
      </label>
    </div>
    <div class="row" style="margin-top:14px">
      <label>Include dirs (comma separated)
        <input type="text" id="include" placeholder="/data/docker,/opt/stacks">
      </label>
      <label>Exclude dirs (comma separated)
        <input type="text" id="exclude" placeholder="/data/docker/archive">
      </label>
    </div>
    <div class="row" style="margin-top:14px">
      <label>Command timeout
        <input type="text" id="timeout" placeholder="30m">
      </label>
      <label>Options</label>
      <div style="flex:1 1 200px; display:flex; flex-direction:column; gap:8px; padding-top:20px">
        <label class="switch"><input type="checkbox" id="autoUpdate"> Auto update (recreate changed services)</label>
        <label class="switch"><input type="checkbox" id="runOnStart"> Run on start</label>
      </div>
    </div>
    <div style="margin-top:16px"><button id="saveBtn">Save configuration</button></div>
  </section>

  <section>
    <h2>Projects</h2>
    <div class="muted" style="margin-bottom:12px">Enable or disable automatic updates per compose file. Last run status is shown after a scan.</div>
    <table>
      <thead><tr><th style="width:60px">Enabled</th><th>Compose file</th><th>Status</th><th>Detail</th></tr></thead>
      <tbody id="projects"></tbody>
    </table>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
let state = null;

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function load() {
  const r = await fetch('api/state'); state = await r.json();
  const c = state.config;
  $('cron').value = c.cron_schedule || '';
  $('tz').value = c.timezone || '';
  $('depth').value = c.scan_depth ?? 5;
  $('include').value = (c.include_dirs || []).join(',');
  $('exclude').value = (c.exclude_dirs || []).join(',');
  $('timeout').value = c.command_timeout || '30m';
  $('autoUpdate').checked = !!c.auto_update;
  $('runOnStart').checked = !!c.run_on_start;
  $('meta').textContent = 'compose: ' + (state.compose || '?')
    + (state.running ? ' · scanning…' : '')
    + (state.next_run ? ' · next: ' + state.next_run : '')
    + (state.last_run ? ' · last: ' + state.last_run : '');
  renderProjects();
}

function renderProjects() {
  const body = $('projects'); body.innerHTML = '';
  const statusByFile = {};
  (state.results || []).forEach(r => statusByFile[r.file] = r);
  const files = state.projects || [];
  if (!files.length) { body.innerHTML = '<tr><td colspan="4" class="muted">No compose files discovered yet.</td></tr>'; return; }
  for (const f of files) {
    const r = statusByFile[f] || {};
    const tr = document.createElement('tr');
    const enabled = r.enabled !== undefined ? r.enabled : true;
    tr.innerHTML = `
      <td><input type="checkbox" ${enabled ? 'checked' : ''}></td>
      <td><code>${f}</code></td>
      <td>${r.status ? `<span class="status ${r.status}">${r.status}</span>` : '<span class="muted">—</span>'}</td>
      <td class="muted">${r.detail || (r.services && r.services.length ? 'eligible: ' + r.services.join(', ') : '')}</td>`;
    tr.querySelector('input').addEventListener('change', async (e) => {
      await fetch('api/project', { method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ file: f, enabled: e.target.checked }) });
      toast('Saved'); load();
    });
    body.appendChild(tr);
  }
}

async function saveConfig() {
  const body = {
    cron_schedule: $('cron').value.trim(),
    timezone: $('tz').value.trim(),
    scan_depth: parseInt($('depth').value, 10) || 0,
    include_dirs: $('include').value.split(',').map(s => s.trim()).filter(Boolean),
    exclude_dirs: $('exclude').value.split(',').map(s => s.trim()).filter(Boolean),
    command_timeout: $('timeout').value.trim(),
    auto_update: $('autoUpdate').checked,
    run_on_start: $('runOnStart').checked,
  };
  const r = await fetch('api/config', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (r.ok) { toast('Configuration saved'); load(); } else { toast('Error: ' + await r.text()); }
}

$('saveBtn').addEventListener('click', saveConfig);
$('runBtn').addEventListener('click', async () => {
  $('runBtn').disabled = true;
  await fetch('api/run', { method: 'POST' });
  toast('Scan started');
  setTimeout(() => { $('runBtn').disabled = false; load(); }, 1500);
});

load();
setInterval(load, 5000);
</script>
</body>
</html>
