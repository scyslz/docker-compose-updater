services:
  compose-auto-updater:
    # Uses the image published by this repo's GitHub Actions workflow.
    # Override with COMPOSE_AUTO_UPDATER_IMAGE in .env to use a fork/other registry.
    image: ${COMPOSE_AUTO_UPDATER_IMAGE:-ghcr.io/scyslz/docker-compose-updater:latest}
    container_name: compose-auto-updater
    restart: unless-stopped
    ports:
      # Web management UI.
      - "8080:8080"
    environment:
      # Bootstrap settings only. Everything else (schedule, project selection…)
      # is edited in the web UI and stored in the config file below.
      # Set WEB_ADDR to "off" to disable the UI.
      WEB_ADDR: ":8080"
      CONFIG_FILE: /config/updater.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent, web-editable configuration. Copy config.example.json here
      # as updater.json to seed initial values.
      - ./config:/config
      # Mount the directories that contain your Compose projects at the SAME
      # absolute path the Docker daemon reports. The updater needs to read the
      # compose files to detect images/build; the running project list itself is
      # discovered from Docker labels (no mount needed for that). Use :rw
      # instead of :ro if you want to edit compose files from the web UI.
      #
      # Example: if `docker ps` labels show
      #   com.docker.compose.project.config_files=/home/hq/docker-data/foo/docker-compose.yml
      # then add:
      - /home/hq/docker-data:/home/hq/docker-data:ro
