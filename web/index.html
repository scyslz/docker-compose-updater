<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compose Auto Updater</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #1c1f26;
    --muted: #667085;
    --input-bg: #ffffff;
    --code-bg: #f0f1f4;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --secondary-border: #cfd4dd;
    --secondary-text: #3a4150;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --border: #2a2f3a;
      --text: #e6e6e6;
      --muted: #8b93a3;
      --input-bg: #0b0d12;
      --code-bg: #0b0d12;
      --accent: #2f6feb;
      --accent-text: #ffffff;
      --secondary-border: #3a4150;
      --secondary-text: #cbd3e0;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    margin: 0; background: var(--bg); color: var(--text);
    -webkit-text-size-adjust: 100%;
  }
  header {
    padding: 14px 20px; background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  section {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px; margin-bottom: 18px; box-shadow: var(--shadow);
  }
  h2 { font-size: 15px; margin: 0 0 14px; }
  code { background: var(--code-bg); padding: 2px 6px; border-radius: 5px; font-size: 12.5px; word-break: break-all; }
  input[type=text], input[type=number] {
    width: 100%; padding: 8px 10px; background: var(--input-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 15px;
  }
  button {
    padding: 8px 14px; border-radius: 7px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-text); font-weight: 600;
    cursor: pointer; font-family: inherit; font-size: 14px;
  }
  button.secondary { background: transparent; color: var(--secondary-text); border-color: var(--secondary-border); }
  button.small { padding: 6px 10px; font-size: 12.5px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.confirm { background: #dc2626; border-color: #dc2626; color: #fff; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row > label { flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  .switch { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font-size: 14px; }
  .status { padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .status.updated { background: #d1fae5; color: #065f46; }
  .status.unchanged { background: #e5e7eb; color: #374151; }
  .status.skipped { background: #fef3c7; color: #854d0e; }
  .status.failed { background: #fee2e2; color: #991b1b; }
  .status.pulled { background: #dbeafe; color: #1e40af; }
  .status.unmounted { background: #ffedd5; color: #9a3412; }
  .status.running { background: #e0e7ff; color: #3730a3; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  @media (prefers-color-scheme: dark) {
    .status.updated { background: #17351f; color: #6ee7a0; }
    .status.unchanged { background: #2a2f3a; color: #b8c0cf; }
    .status.skipped { background: #33301a; color: #e6d78a; }
    .status.failed { background: #3a1c1c; color: #f0a1a1; }
    .status.pulled { background: #1c2a3a; color: #8fc4f0; }
    .status.unmounted { background: #3a2a1c; color: #f0c08a; }
    .status.running { background: #1e2748; color: #a5b4fc; }
  }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .toast {
    position: fixed; bottom: 20px; right: 20px; left: 20px; max-width: 360px; margin-left: auto;
    background: var(--card); border: 1px solid var(--border); padding: 12px 16px;
    border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none;
    box-shadow: var(--shadow); z-index: 50;
  }
  .toast.show { opacity: 1; }
  .warn { color: #b45309; font-size: 13px; }
  @media (prefers-color-scheme: dark) { .warn { color: #f0c08a; } }

  /* Projects: table on desktop, cards on mobile */
  .filters { margin-bottom: 14px; }
  .filter-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: end; }
  .filter { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); }
  .filter select, .filter input { padding: 6px 9px; background: var(--input-bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 13px; }
  .filter input { width: 200px; }
  .filter-actions { margin-left: auto; align-self: end; display: flex; gap: 8px; }
  .filter-summary { font-size: 12px; margin-top: 8px; }
  .proj-scroll { height: 58vh; min-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
  .proj-table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 14px; }
  .proj-table th, .proj-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .proj-table th { position: sticky; top: 0; background: var(--card); color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; z-index: 1; }
  .proj-table tr:last-child td { border-bottom: none; }
  .project-name { display: block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; font-weight: 700; line-height: 1.3; color: var(--text); letter-spacing: .01em; }
  .project-file { display: block; margin-top: 3px; max-width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .project-file.expanded { white-space: normal; overflow-wrap: anywhere; }
  .project-tags { margin-top: 2px; font-size: 11.5px; }
  .state-pill {
    display: inline-flex; align-items: center; gap: 5px; margin-left: 7px;
    padding: 1px 7px 1px 6px; border: 1px solid var(--border); border-radius: 999px;
    font-size: 10.5px; font-weight: 500; letter-spacing: .01em;
    vertical-align: 1px; white-space: nowrap; color: var(--muted);
  }
  .state-pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .state-pill.ok { color: #166534; background: #f0fdf4; border-color: #bbf7d0; }
  .state-pill.warn { color: #b45309; background: #fffbeb; border-color: #fde68a; }
  .state-pill.bad { color: #b91c1c; background: #fef2f2; border-color: #fecaca; }
  .state-pill.off { color: var(--muted); background: transparent; }
  .type-pill {
    display: inline-flex; align-items: center; margin-left: 6px; padding: 0 7px;
    border: 1px solid #c7d2fe; border-radius: 999px;
    font-size: 10.5px; font-weight: 500; color: #4338ca; background: #eef2ff;
    vertical-align: 1px; white-space: nowrap;
  }
  .type-pill.unmounted { color: #b45309; background: #fffbeb; border-color: #fde68a; }
  @media (prefers-color-scheme: dark) {
    .state-pill.ok { color: #6ee7a0; background: rgba(22,101,52,.25); border-color: #2f6b45; }
    .state-pill.warn { color: #f0c08a; background: rgba(180,83,9,.22); border-color: #7c5a24; }
    .state-pill.bad { color: #fca5a5; background: rgba(185,28,28,.22); border-color: #7f2a2a; }
    .state-pill.off { color: var(--muted); background: transparent; }
    .type-pill { color: #c7d2fe; background: rgba(67,56,202,.25); border-color: #3f3f8f; }
    .type-pill.unmounted { color: #f0c08a; background: rgba(180,83,9,.22); border-color: #7c5a24; }
  }
  .lastcheck { font-size: 12px; margin-top: 4px; }
  .lastcheck span { font-size: 12px; }
  tr.unmounted-row { opacity: .55; }

  /* Status column (update result only) */
  .ustatus { padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .ustatus.success { background: #d1fae5; color: #065f46; }
  .ustatus.fail { background: #fee2e2; color: #991b1b; }
  .ustatus.running { background: #e0e7ff; color: #3730a3; animation: pulse 1.2s ease-in-out infinite; }
  .ustatus.unchanged { background: #e5e7eb; color: #374151; }
  .ustatus.skipped { background: #fef3c7; color: #854d0e; }
  .ustatus.none { background: transparent; color: var(--muted); }
  .ustatus.stopped { background: #e5e7eb; color: #374151; }
  .ustatus.processing { background: #e0e7ff; color: #3730a3; animation: pulse 1.2s ease-in-out infinite; }
  .ustatus.restarted { background: #dbeafe; color: #1e40af; }
  .lastcheck-cell { font-size: 12px; color: var(--muted); white-space: nowrap; }
  @media (prefers-color-scheme: dark) {
    .ustatus.success { background: #17351f; color: #6ee7a0; }
    .ustatus.unchanged { background: #2a2f3a; color: #b8c0cf; }
    .ustatus.skipped { background: #33301a; color: #e6d78a; }
    .ustatus.fail { background: #3a1c1c; color: #f0a1a1; }
    .ustatus.running { background: #1e2748; color: #a5b4fc; }
    .ustatus.stopped { background: #2a2f3a; color: #b8c0cf; }
    .ustatus.processing { background: #1e2748; color: #a5b4fc; }
    .ustatus.restarted { background: #1c2a3a; color: #8fc4f0; }
  }
  .action-buttons { display: flex; gap: 5px; flex-wrap: nowrap; align-items: center; }
  .icon-btn { width: 30px; height: 30px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn.sched-btn.on { background: #dcfce7; border-color: #86efac; color: #166534; }
  .icon-btn.confirm { background: #dc2626; border-color: #dc2626; color: #fff; }
  .icon-btn.busy { animation: pulse 1.2s ease-in-out infinite; }
  @media (prefers-color-scheme: dark) {
    .icon-btn.sched-btn.on { background: #17351f; border-color: #2f6b45; color: #6ee7a0; }
  }

  /* Compose editor */
  dialog.editor {
    width: min(900px, 94vw); max-height: 92vh; padding: 0;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--card); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  dialog.editor::backdrop { background: rgba(0,0,0,.45); }
  .editor-head { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .editor-head h3 { margin: 0; font-size: 15px; }
  .editor-path { margin-top: 3px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
  .editor-body { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; }
  #editorText {
    width: 100%; min-height: 50vh; resize: vertical; padding: 10px;
    background: var(--input-bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px; line-height: 1.5; tab-size: 2;
  }
  #editorText[readonly] { opacity: .75; }
  .editor-foot { display: flex; align-items: center; gap: 10px; }
  .editor-foot .muted { flex: 1; }
  .editor-warning { font-size: 12px; color: #b45309; white-space: pre-line; }
  @media (prefers-color-scheme: dark) { .editor-warning { color: #f0c08a; } }

  /* Folder picker */
  dialog.dir-picker { width: min(560px, 94vw); }
  .dir-list {
    max-height: 52vh; overflow-y: auto; border: 1px solid var(--border);
    border-radius: 8px; background: var(--card);
  }
  .dir-item {
    display: flex; align-items: center; gap: 9px; width: 100%; margin: 0;
    padding: 8px 12px; border: 0; border-bottom: 1px solid var(--border);
    border-radius: 0; background: transparent; color: var(--text);
    font-size: 13px; text-align: left; cursor: pointer; box-shadow: none;
  }
  .dir-item:last-child { border-bottom: 0; }
  .dir-item:hover { background: var(--input-bg); }
  .dir-item .dir-icon { color: var(--muted); display: inline-flex; }
  .dir-item .dir-icon svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .dir-empty { padding: 12px; color: var(--muted); font-size: 13px; }
  .dir-new { display: flex; align-items: center; gap: 8px; }
  .dir-new[hidden] { display: none; }
  .dir-new input {
    flex: 1; min-width: 0; padding: 7px 9px; border: 1px solid var(--border);
    border-radius: 7px; background: var(--input-bg); color: var(--text); font-size: 13px;
  }

  /* Check log */
  .log-scroll { height: 40vh; min-height: 160px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
  .log-table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 13px; }
  .log-table th, .log-table td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; word-break: break-word; white-space: normal; }
  .log-table td.detail-cell { color: var(--muted); }
  .detail-inner { max-height: 12em; overflow-y: auto; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  .log-table th { position: sticky; top: 0; background: var(--card); color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .log-table tr:last-child td { border-bottom: none; }
  .log-project { display: block; min-width: 0; max-width: 100%; font-size: 15px; font-weight: 700; line-height: 1.35; color: var(--text); }
  .log-project .log-file { display: block; margin-top: 2px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 400; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .log-project .log-file.expanded { white-space: normal; overflow-wrap: anywhere; }
  .log-table th:nth-child(3), .log-table td:nth-child(3) { width: 240px; max-width: 240px; }
  .log-cards { display: none; }
  .status.manual { background: #ede9fe; color: #5b21b6; }
  .status.cron { background: #e0f2fe; color: #075985; }
  @media (prefers-color-scheme: dark) {
    .status.manual { background: #2a2140; color: #c4b5fd; }
    .status.cron { background: #10283a; color: #7dd3fc; }
  }
  .proj-cards { display: none; }

  @media (max-width: 640px) {
    header { padding: 12px 14px; }
    main { padding: 12px; }
    section { padding: 14px; border-radius: 12px; }
    .filter-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end; }
    .filter { font-size: 11px; min-width: 0; }
    .filter select { width: 100%; }
    .filter input { width: 100%; min-width: 0; }
    .filter-search { grid-column: span 2; }
    .filter-actions { grid-column: 1 / -1; margin-left: 0; width: 100%; justify-content: flex-end; }
    .filter-summary { text-align: right; }
    .proj-scroll { display: none; }
    .proj-cards { display: flex; flex-direction: column; gap: 8px; height: calc(4 * 129px + 3 * 8px); min-height: 220px; overflow-y: auto; }
    .proj-card {
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
      display: flex; flex-direction: column; gap: 8px; background: var(--card);
    }
    .proj-card .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .proj-card .card-title { font-weight: 600; font-size: 15px; }
    .proj-card .card-title .project-name { font-size: 15.5px; display: inline; }
    .proj-card .card-path {
      color: var(--muted); font-size: 11.5px; margin-top: -4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .proj-card.disabled { opacity: .55; }
    .proj-card .card-times { display: flex; gap: 12px; flex-wrap: wrap; }
    .proj-card .card-time {
      display: flex; flex-direction: row; align-items: baseline; gap: 4px; min-width: 0;
    }
    .proj-card .card-time-label { font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .proj-card .card-time-value { font-size: 11.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .proj-card .card-actions {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-top: 2px;
      border-top: 1px solid var(--border);
    }
    .proj-card .card-actions label.switch { flex: 1; font-size: 13.5px; min-height: 40px; }
    .proj-card .card-actions button { flex: none; white-space: nowrap; }
    .proj-card .card-actions .icon-btn { width: 34px; height: 34px; }
    .proj-card .card-actions .action-buttons { width: 100%; flex-wrap: wrap; }
    dialog.editor { width: 96vw; max-height: 94vh; }
    .editor-body { padding: 12px; }
    #editorText { min-height: 55vh; }
    .log-scroll { display: none; }
    .log-cards { display: flex; flex-direction: column; gap: 10px; height: 40vh; min-height: 160px; overflow-y: auto; }
    .log-card {
      border: 1px solid var(--border); border-radius: 10px; padding: 12px;
      display: flex; flex-direction: column; gap: 6px; background: var(--card);
    }
    .log-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .log-card-head .log-project { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .log-card-meta { font-size: 12px; color: var(--muted); }
    .log-card-detail { font-size: 11.5px; overflow-wrap: anywhere; max-height: 12em; overflow-y: auto; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  }
</style>
</head>
<body>
<header>
  <h1>Compose Auto Updater</h1>
  <span class="muted" id="meta"></span>
  <span style="flex:1"></span>
  <div class="actions">
    <button id="runBtn" class="secondary">Run cron</button>
  </div>
</header>
<main>
  <section>
    <h2>Projects</h2>
    <div class="muted" style="margin-bottom:12px">
      Toggle the clock icon to schedule a project; other actions run immediately.
    </div>
    <div class="filters">
      <div class="filter-row">
        <label class="filter">Update
          <select id="filterUpdate">
            <option value="all">All</option>
            <option value="eligible">Updatable</option>
            <option value="ineligible">Not updatable</option>
          </select>
        </label>
        <label class="filter">Cron
          <select id="filterCron">
            <option value="all">All</option>
            <option value="on">Enabled</option>
            <option value="off">Disabled</option>
          </select>
        </label>
        <label class="filter">State
          <select id="filterState">
            <option value="all">All</option>
            <option value="running">Running</option>
            <option value="stopped">Stopped</option>
            <option value="imported">Imported</option>
            <option value="problems">Problems</option>
          </select>
        </label>
        <label class="filter">Type
          <select id="filterType">
            <option value="all">All</option>
            <option value="compose" selected>Compose</option>
            <option value="standalone">Standalone</option>
          </select>
        </label>
        <label class="filter filter-search">Search
          <input type="text" id="filterSearch" placeholder="project or path">
        </label>
        <div class="filter-actions">
          <button id="importBtn" class="secondary small">Import</button>
          <button id="runFilteredBtn" class="secondary small">Upgrade all</button>
        </div>
      </div>
      <div class="filter-summary muted" id="filterSummary"></div>
    </div>
    <div class="proj-scroll">
      <table class="proj-table">
        <thead><tr><th>Project / file</th><th style="width:110px">Status</th><th style="width:170px">Last check</th><th style="width:170px">Last update</th><th style="width:265px">Actions</th></tr></thead>
        <tbody id="projects"></tbody>
      </table>
    </div>
    <div class="proj-cards" id="projectsCards"></div>
    <div id="scanError" class="warn" style="margin-top:10px"></div>
  </section>

  <section>
    <h2>Logs</h2>
    <div class="muted" style="margin-bottom:12px">Recent manual and scheduled checks.</div>
    <div class="log-scroll" data-scrollkey="logs-outer">
      <table class="log-table">
        <thead><tr><th style="width:150px">Time</th><th style="width:80px">Trigger</th><th style="width:240px">Project</th><th style="width:90px">Result</th><th>Detail</th></tr></thead>
        <tbody id="logs"></tbody>
      </table>
    </div>
    <div class="log-cards" id="logsCards"></div>
  </section>

  <section>
    <h2>Schedule</h2>
    <div class="row">
      <label>Cron schedule
        <input type="text" id="cron" placeholder="0 */6 * * *">
      </label>
      <label>Timezone
        <input type="text" id="tz" placeholder="Asia/Shanghai">
      </label>
      <label>Command timeout
        <input type="text" id="timeout" placeholder="30m">
      </label>
    </div>
    <div class="row" style="margin-top:14px">

<script>
const $ = (id) => document.getElementById(id);
let state = null;
// Compose paths expanded by tap/click; kept across the 5s re-render.
const expandedPaths = new Set();
let editorFile = null;
let editorProject = '';

const ICONS = {
  schedule: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>',
  check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
  start: '<svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"/></svg>',
  stop: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg>',
  restart: '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>',
  recreate: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 12-8.373 8.373a1 1 0 1 1-3-3L12 9"/><path d="m18 15 4-4"/><path d="m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172V7l-2.26-2.26a6 6 0 0 0-4.202-1.756L9 2.96l.92.82A6.18 6.18 0 0 1 12 8.4V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5"/></svg>',
  edit: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  convert: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>',
  folder: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>'
};

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// wrap runs an action behind a two-step confirmation: the first click arms the
// button (label becomes confirmLabel), a second click within the timeout runs
// the action, and any other click cancels. Returns a click handler. Icon
// buttons keep their glyph and turn red instead of showing text.
function dblConfirm(btn, confirmLabel, action) {
  let armed = false, timer = null, orig = null, origTitle = null;
  const reset = () => {
    if (timer) { clearTimeout(timer); timer = null; }
    armed = false;
    btn.classList.remove('confirm');
    if (orig !== null) { btn.textContent = orig; orig = null; }
    if (origTitle !== null) { btn.title = origTitle; origTitle = null; }
    window.__confirmArmed = false;
  };
  return () => {
    if (!armed) {
      armed = true;
      window.__confirmArmed = true;
      if (btn.classList.contains('icon-btn')) {
        origTitle = btn.title;
        btn.classList.add('confirm');
        btn.title = 'Click again to confirm';
      } else {
        orig = btn.textContent;
        btn.textContent = confirmLabel;
        btn.classList.add('confirm');
      }
      timer = setTimeout(reset, 4000);
      return;
    }
    reset();
    action();
  };
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function apiError(res) {
  const text = await res.text().catch(() => '');
  return text || ('HTTP ' + res.status);
}

// Preserve scroll positions of scrollable boxes across re-renders. Keyed by a
// stable scrollkey attribute so the same logical box keeps its position.
// If the box was scrolled to (near) the bottom, it stays pinned to the bottom
// so streaming output keeps following.
function snapshotScroll() {
  const m = {};
  document.querySelectorAll('[data-scrollkey]').forEach(el => {
    const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 8;
    m[el.getAttribute('data-scrollkey')] = { top: el.scrollTop, atBottom };
  });
  return m;
}
function restoreScroll(m) {
  document.querySelectorAll('[data-scrollkey]').forEach(el => {
    const k = el.getAttribute('data-scrollkey');
    const saved = m[k];
    if (!saved) return;
    if (saved.atBottom) el.scrollTop = el.scrollHeight;
    else el.scrollTop = saved.top;
  });
}

async function load() {
  const r = await fetch('api/state'); state = await r.json();
  const c = state.config;
  $('cron').value = c.cron_schedule || '';
  $('tz').value = c.timezone || '';
  $('timeout').value = c.command_timeout || '30m';
  $('autoUpdate').checked = !!c.auto_update;
  $('runOnStart').checked = !!c.run_on_start;
  const meta = [state.compose || '?'];
  if (state.running) meta.push('scanning…');
  if (state.next_run) meta.push('next ' + countdownText(state.next_run));
  if (state.last_run) meta.push('last run ' + agoParts(state.last_run).text);
  $('meta').textContent = meta.join(' · ');
  $('meta').title = [
    state.next_run ? 'Next run: ' + fmtTime(state.next_run) : '',
    state.last_run ? 'Last run: ' + fmtTime(state.last_run) : '',
  ].filter(Boolean).join('\n');
  $('scanError').textContent = state.scan_error ? 'Error listing projects: ' + state.scan_error : '';
  const scrollMemo = snapshotScroll();
  // Skip re-rendering the project list while a two-step confirm is armed, so a
  // background refresh does not wipe the confirmation state.
  if (!window.__confirmArmed) renderProjects();
  renderLogs();
  restoreScroll(scrollMemo);
}

function statusHtml(r) {
  return r.status ? `<span class="status ${esc(r.status)}">${esc(r.status)}</span>` : '';
}
function fmtTime(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return s;
  return d.toLocaleString();
}
function lastCheckHtml(r) {
  if (!r.when) return '';
  return esc(fmtTime(r.when));
}
// countdownText renders the time until the next scheduled run as a compact
// relative value ("in 4h 12m") instead of a raw timestamp.
function countdownText(s) {
  const d = new Date(s);
  if (isNaN(d)) return s;
  const sec = Math.round((d.getTime() - Date.now()) / 1000);
  if (sec <= 0) return 'due';
  if (sec < 60) return 'in <1m';
  const min = Math.floor(sec / 60);
  if (min < 60) return 'in ' + min + 'm';
  const hr = Math.floor(min / 60);
  if (hr < 24) return 'in ' + hr + 'h' + (min % 60 ? ' ' + (min % 60) + 'm' : '');
  const days = Math.floor(hr / 24);
  if (days < 7) return 'in ' + days + 'd' + (hr % 24 ? ' ' + (hr % 24) + 'h' : '');
  return 'on ' + fmtTime(s);
}
// agoParts renders a timestamp as a compact relative age for mobile cards and
// the header. The full localized timestamp is returned separately for tooltips.
function agoParts(s) {
  if (!s) return { text: '', full: '' };
  const d = new Date(s);
  if (isNaN(d)) return { text: s, full: s };
  const now = new Date();
  const sec = Math.max(0, Math.floor((now.getTime() - d.getTime()) / 1000));
  let text;
  if (sec < 45) text = 'just now';
  else if (sec < 3600) text = Math.max(1, Math.floor(sec / 60)) + 'm ago';
  else if (sec < 86400) text = Math.floor(sec / 3600) + 'h ago';
  else if (sec < 7 * 86400) text = Math.floor(sec / 86400) + 'd ago';
  else {
    const opts = { month: 'short', day: 'numeric' };
    if (d.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
    text = d.toLocaleDateString(undefined, opts);
  }
  return { text, full: fmtTime(s) };
}
// A project is "not updatable" only when a check definitively reported that it
// has no image-based services (build-only / no image). A "skipped: not selected
// for scheduled updates" result says nothing about updatability.
function isNotUpdatable(p, r) {
  if (!p.mounted) return true;
  return r.status === 'skipped' && /build|no image/i.test(r.detail || '');
}
// Map a raw result status to the compact update-status column. A project with a
// result was actually checked (cron or manual), so it always shows a status;
// only projects that were never checked show a dash.
function updateStatusHtml(r) {
  switch (r.status) {
    case 'updated': case 'pulled': case 'started': case 'restarted': case 'recreated':
      return `<span class="ustatus success">${esc(r.status)}</span>`;
    case 'unchanged':
      return '<span class="ustatus unchanged">unchanged</span>';
    case 'stopped':
      return '<span class="ustatus stopped">stopped</span>';
    case 'failed':
      return '<span class="ustatus fail">failed</span>';
    case 'unmounted':
      return '<span class="ustatus fail">unmounted</span>';
    case 'processing':
      return '<span class="ustatus processing">processing</span>';
    case 'skipped':
      return '<span class="ustatus skipped">skipped</span>';
    default:
      return '<span class="ustatus none">—</span>';
  }
}
function projectFields(p, r) {
  const notUpdatable = isNotUpdatable(p, r);
  const updatedAt = r.updated_at || ((state.last_updates || {})[p.file] || '');
  const checked = agoParts(r.when);
  const updated = agoParts(updatedAt);
  return {
    key: p.file || p.project,
    scheduled: !!(state.enabled || {})[p.file || p.project],
    statusHtml: statusHtml(r),
    updateStatusHtml: updateStatusHtml(r),
    updatable: !notUpdatable,
    // Show the time only when the project was actually checked.
    lastCheck: lastCheckHtml(r),
    // Last successful update (updated/pulled/started/recreated) can be older
    // than the last check and survives restarts via the persisted config.
    lastUpdate: updatedAt ? esc(fmtTime(updatedAt)) : '<span class="muted">—</span>',
    // Compact mobile card values: relative age plus the full time for hover.
    lastCheckAgo: checked.full ? esc(checked.text) : '',
    lastCheckFull: checked.full ? esc(checked.full) : '',
    lastUpdateAgo: updated.full ? esc(updated.text) : '',
    lastUpdateFull: updated.full ? esc(updated.full) : '',
  };
}

function wireSchedule(btn, p, enabled) {
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      const res = await fetch('api/project', { method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ file: p.file || p.project, enabled: !enabled }) });
      if (!res.ok) throw new Error(await apiError(res));
      toast(enabled ? 'Removed from schedule' : 'Added to schedule');
      await load();
    } catch (e) {
      toast('Error: ' + e.message);
      btn.disabled = false;
    }
  });
}
function wireButton(btn, p) {
  const isIcon = btn.classList.contains('icon-btn');
  const action = async () => {
    btn.disabled = true;
    if (isIcon) btn.classList.add('busy');
    else btn.textContent = 'Checking…';
    try {
      const res = await fetch('api/check', { method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ file: p.file, working_dir: p.working_dir, project: p.project }) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error((data && data.status) || ('HTTP ' + res.status));
      if (data.status === 'already-running') {
        toast(p.project + ' is already being checked');
      } else {
        toast('Checking ' + p.project + '…');
      }
      // The periodic load() reflects progress and the final result.
      await load();
    } catch (e) {
      toast('Error: ' + e.message);
      btn.disabled = false;
      if (isIcon) btn.classList.remove('busy');
      else btn.textContent = 'Check & update';
    }
  };
  btn.addEventListener('click', dblConfirm(btn, 'Confirm?', action));
}

// Lifecycle actions (start/stop/restart) run asynchronously on the server; the
// periodic load() picks up the result and progress output.
function wireAction(btn, p, action) {
  if (action === 'convert') { btn.addEventListener('click', () => openConvert(p)); return; }
  if (action === 'unimport' || action === 'delete') {
    const deleting = action === 'delete';
    btn.addEventListener('click', dblConfirm(btn, 'Remove?', async () => {
      btn.disabled = true;
      try {
        const res = await fetch(deleting ? 'api/delete' : 'api/unimport', { method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ file: p.file, project: p.project }) });
        if (!res.ok) throw new Error(await apiError(res));
        toast('Removed ' + p.project + ' from the list');
        await load();
      } catch (e) {
        toast('Error: ' + e.message);
      } finally {
        btn.disabled = false;
      }
    }));
    return;
  }
  const run = async () => {
    btn.disabled = true;
    try {
      const res = await fetch('api/action', { method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ file: p.file, project: p.project, action }) });
      if (!res.ok) throw new Error(await apiError(res));
      const data = await res.json().catch(() => ({}));
      if (data.status === 'already-running') {
        toast(p.project + ' is already busy');
      } else {
        toast(action.charAt(0).toUpperCase() + action.slice(1) + 'ing ' + p.project + '…');
      }
      await load();
    } catch (e) {
      toast('Error: ' + e.message);
    } finally {
      btn.disabled = false;
    }
  };
  btn.addEventListener('click', action === 'start' ? run : dblConfirm(btn, 'Confirm?', run));
}

async function openEditor(p) {
  if (!p.file) { toast('No compose file to edit'); return; }
  try {
    const res = await fetch('api/compose?file=' + encodeURIComponent(p.file)
      + '&project=' + encodeURIComponent(p.project || ''));
    if (!res.ok) throw new Error(await apiError(res));
    const data = await res.json();
    editorFile = p.file;
    editorProject = p.project || '';
    $('editorPath').textContent = p.file;
    $('editorText').value = data.content || '';
    $('editorText').readOnly = !data.writable;
    $('editorSave').disabled = !data.writable;
    $('editorInfo').textContent = data.writable
      ? 'Saving keeps the previous version as ' + p.file + '.bak'
      : 'Read-only inside the container. Mount this directory with :rw to enable editing.';
    $('editorWarning').textContent = '';
    $('editor').showModal();
  } catch (e) {
    toast('Error: ' + e.message);
  }
}

async function saveEditor() {
  if (!editorFile) {
    // convert flow: save to a chosen folder
    const dir = await pickDirectory($('editorSave').dataset.dir || '/tmp/converted');
    if (!dir) return;
    $('editorPath').textContent = dir.replace(/\/+$/, '') + '/compose.yaml';
    const btn = $('editorSave');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const res = await fetch('api/compose/save-new', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ dir, content: $('editorText').value }) });
      if (!res.ok) throw new Error(await apiError(res));
      const data = await res.json();
      if (data.warning) {
        $('editorWarning').textContent = 'Saved to ' + data.file + ', but ' + data.warning;
        toast('Saved with warnings');
        load();
      } else {
        toast('Saved: ' + data.file);
        $('editor').close();
        load();
      }
    } catch (e) { $('editorWarning').textContent = 'Save failed: ' + e.message; }
    finally { btn.textContent = 'Save'; btn.disabled = false; }
    return;
  }
  const btn = $('editorSave');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    const res = await fetch('api/compose', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ file: editorFile, project: editorProject, content: $('editorText').value }) });
    if (!res.ok) throw new Error(await apiError(res));
    const data = await res.json().catch(() => ({}));
    if (data.warning) {
      $('editorWarning').textContent = data.warning;
      toast('Saved with warnings');
      load();
    } else {
      toast('Saved (backup: ' + (data.backup || '.bak') + ')');
      $('editor').close();
      load();
    }
  } catch (e) {
    $('editorWarning').textContent = 'Save failed: ' + e.message;
  } finally {
    btn.textContent = 'Save';
    btn.disabled = $('editorText').readOnly;
  }
}

function wireEdit(btn, p) {
  if (!btn) return; // standalone containers have no compose file to edit
  btn.addEventListener('click', () => openEditor(p));
}

function passesFilters(p, f) {
  const fu = $('filterUpdate').value;
  const fc = $('filterCron').value;
  const q = ($('filterSearch').value || '').trim().toLowerCase();
  if (fu === 'eligible' && !f.updatable) return false;
  if (fu === 'ineligible' && f.updatable) return false;
  if (fc === 'on' && !f.scheduled) return false;
  if (fc === 'off' && f.scheduled) return false;
  const fs = $('filterState').value;
  if (fs !== 'all') {
    const problems = p.health === 'unhealthy' || p.restarting;
    if (fs === 'running' && !p.running) return false;
    if (fs === 'stopped' && (p.running || p.imported)) return false;
    if (fs === 'imported' && !p.imported) return false;
    if (fs === 'problems' && !problems) return false;
  }
  const ft = $('filterType').value;
  if (ft === 'compose' && p.compose === false) return false;
  if (ft === 'standalone' && p.compose !== false) return false;
  if (q) {
    const hay = ((p.project || '') + ' ' + (p.file || '')).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

// Return the projects currently passing the filters, with their result merged.
function filteredProjects() {
  const statusByFile = {};
  (state.results || []).forEach(r => statusByFile[r.file] = r);
  (state.logs || []).forEach(l => {
    if (l.status === 'processing' && l.file) statusByFile[l.file] = { file: l.file, status: 'processing', detail: l.detail || 'checking…', when: l.when };
  });
  const out = [];
  for (const p of (state.projects || [])) {
    const r = statusByFile[p.file] || {};
    const f = projectFields(p, r);
    if (passesFilters(p, f)) out.push(p);
  }
  return out;
}
function currentFilteredProjects() { return filteredProjects(); }

function projectState(p, isCompose) {
  if (!isCompose) {
    if (!p.running) return { label: 'stopped', cls: 'off', title: 'container is stopped' };
    if (p.restarting) return { label: 'restarting', cls: 'warn', title: 'container is restarting' };
    if (p.health === 'unhealthy') return { label: 'unhealthy', cls: 'bad', title: 'healthcheck is failing' };
    if (p.health === 'starting') return { label: 'starting', cls: 'warn', title: 'healthcheck is starting' };
    return { label: 'running', cls: 'ok', title: 'container is running' };
  }
  if (p.imported) return { label: 'imported', cls: 'off', title: 'imported compose file; no containers created yet' };
  if (p.total > 0 && p.services === 0) return { label: 'stopped', cls: 'off', title: 'no running containers' };
  if (p.restarting) return { label: 'restarting', cls: 'warn', title: 'a container is restarting' };
  if (p.health === 'unhealthy') return { label: 'unhealthy', cls: 'bad', title: 'a container healthcheck is failing' };
  const counts = (p.total || 0) > 1 ? ` ${p.services}/${p.total}` : '';
  if (p.services < p.total) return { label: 'partial' + counts, cls: 'warn', title: 'only some containers are running' };
  if (p.health === 'starting') return { label: 'starting' + counts, cls: 'warn', title: 'a healthcheck is starting' };
  return { label: 'running' + counts, cls: 'ok', title: p.services + ' of ' + p.total + ' container(s) running' };
}

function renderProjects() {
  const tbody = $('projects'); const cards = $('projectsCards');
  tbody.innerHTML = ''; cards.innerHTML = '';
  const statusByFile = {};
  (state.results || []).forEach(r => statusByFile[r.file] = r);
  // Overlay any in-progress checks so the row shows "running".
  (state.logs || []).forEach(l => {
    if (l.status === 'processing' && l.file) statusByFile[l.file] = { file: l.file, status: 'processing', detail: l.detail || 'checking…', when: l.when };
  });
  const all = state.projects || [];
  let shown = 0;
  for (const p of all) {
    const r = statusByFile[p.file] || {};
    const f = projectFields(p, r);
    if (!passesFilters(p, f)) continue;
    shown++;
    const running = p.running !== false;
    const busy = r.status === 'running';
    const isCompose = p.compose !== false;
    // A standalone container has no compose file, so "not mounted" does not
    // apply to it: it can still be started, stopped, restarted, and converted.
    const unmounted = isCompose && !p.mounted;
    const st = projectState(p, isCompose);
    const typePill = isCompose
      ? ''
      : ' <span class="type-pill" title="standalone Docker container, not managed by Compose">standalone</span>';
    const mountPill = unmounted
      ? ' <span class="type-pill unmounted" title="compose file is not readable inside the container">not mounted</span>'
      : '';
    const iconBtn = (cls, icon, title, disabled, action) =>
      `<button class="${cls}"${action ? ` data-action="${action}"` : ''}${disabled ? ' disabled' : ''} title="${esc(title)}" aria-label="${esc(title)}">${ICONS[icon]}</button>`;
    const lockReason = "the updater cannot control its own project";
    const schedDisabled = !isCompose || !p.mounted || !running;
    const schedTitle = !isCompose
      ? 'standalone container — scheduling unavailable (convert to Compose first)'
      : (!p.mounted
        ? 'path not mounted — scheduling unavailable'
        : (!running ? 'project is stopped — scheduling unavailable'
          : (f.scheduled ? 'Scheduled updates: on' : 'Scheduled updates: off')));
    const schedBtn = `<button class="secondary small icon-btn sched-btn${f.scheduled ? ' on' : ''}"${schedDisabled ? ' disabled' : ''} title="${esc(schedTitle)}" aria-label="${esc(schedTitle)}" aria-pressed="${f.scheduled ? 'true' : 'false'}">${ICONS.schedule}</button>`;
    const checkBtn = iconBtn('secondary small icon-btn check-btn', 'check',
      !isCompose ? 'standalone container — no compose file to check' : (busy ? 'Checking…' : 'Check & update'),
      !isCompose || !p.mounted || busy);
    const startBtn = iconBtn('secondary small icon-btn act-btn', 'start',
      running ? (isCompose ? 'Project is already running' : 'Container is already running')
        : (isCompose ? 'Start project' : 'Start container'),
      busy || running || unmounted, 'start');
    const stopBtn = iconBtn('secondary small icon-btn act-btn', 'stop',
      p.self ? lockReason : (!running ? (isCompose ? 'Project is already stopped' : 'Container is already stopped')
        : (isCompose ? 'Stop project' : 'Stop container')),
      busy || p.self || !running || unmounted, 'stop');
    const restartBtn = iconBtn('secondary small icon-btn act-btn', 'restart',
      p.self ? lockReason : (!running ? 'Start the ' + (isCompose ? 'project' : 'container') + ' before restarting'
        : (isCompose ? 'Restart project' : 'Restart container')),
      busy || p.self || !running || unmounted, 'restart');
    const recreateBtn = iconBtn('secondary small icon-btn act-btn', 'recreate',
      isCompose
        ? (p.self ? lockReason : 'Force recreate containers (apply compose changes)')
        : 'Convert to Compose first to enable recreate',
      isCompose ? (!p.mounted || busy || p.self) : true, 'recreate');
    const removable = !running && (p.imported || !isCompose || p.mounted);
    const removeTitle = p.imported
      ? 'Remove from list (the compose file is kept on disk)'
      : 'Remove from list (containers, volumes and files are kept)';
    const removeBtn = iconBtn('secondary small icon-btn act-btn remove-btn', 'trash',
      removeTitle, busy, p.imported ? 'unimport' : 'delete');
    const editBtn = isCompose
      ? iconBtn('secondary small icon-btn edit-btn', 'edit', 'View / edit compose file', !p.mounted)
      : '';
    const convertBtn = isCompose
      ? ''
      : iconBtn('secondary small icon-btn act-btn', 'convert', 'Convert to Compose', busy, 'convert');
    // View/edit and Convert share the last slot: the former for Compose
    // projects, the latter for standalone containers.
    // Stopped projects get a remove button instead of recreate; running
    // projects never offer it.
    const lifecycle = startBtn + stopBtn + restartBtn
      + (removable ? removeBtn : recreateBtn);
    const fileText = isCompose ? esc(p.file || '(no file)') : '';
    const expanded = isCompose && p.file && expandedPaths.has(p.file);
    const pathAttrs = isCompose && p.file ? ` data-path="${esc(p.file)}" title="${esc(p.file)}"` : '';
    // Standalone containers only get the single "— standalone" tag line.
    const fileHtml = fileText
      ? `<span class="project-file${expanded ? ' expanded' : ''}"${pathAttrs}>${fileText}</span>`
      : '';
    const cardTimes = [
      f.lastCheckFull ? `<div class="card-time">
          <span class="card-time-label">Checked</span>
          <span class="card-time-value" title="${f.lastCheckFull}">${f.lastCheckAgo}</span>
        </div>` : '',
      f.lastUpdateFull ? `<div class="card-time">
          <span class="card-time-label">Updated</span>
          <span class="card-time-value" title="${f.lastUpdateFull}">${f.lastUpdateAgo}</span>
        </div>` : '',
    ].join('');

    const tr = document.createElement('tr');
    tr.className = unmounted ? 'unmounted-row' : '';
    tr.innerHTML = `
      <td>
        <span class="project-name">${esc(p.project)}</span><span class="state-pill ${st.cls}" title="${esc(st.title)}">${esc(st.label)}</span>${typePill}${mountPill}
        ${fileHtml}
      </td>
      <td>${f.updateStatusHtml}</td>
      <td class="lastcheck-cell">${f.lastCheck}</td>
      <td class="lastcheck-cell">${f.lastUpdate}</td>
      <td><div class="action-buttons">${schedBtn}${checkBtn}${lifecycle}${editBtn}${convertBtn}</div></td>`;
    wireSchedule(tr.querySelector('.sched-btn'), p, f.scheduled);
    wireButton(tr.querySelector('.check-btn'), p);
    wireEdit(tr.querySelector('.edit-btn'), p);
    tr.querySelectorAll('.act-btn').forEach(b => wireAction(b, p, b.dataset.action));
    tbody.appendChild(tr);

    const card = document.createElement('div');
    card.className = 'proj-card' + (unmounted ? ' disabled' : '');
    card.innerHTML = `
      <div class="card-head">
        <span class="card-title"><span class="project-name">${esc(p.project)}</span><span class="state-pill ${st.cls}" title="${esc(st.title)}">${esc(st.label)}</span>${typePill}${mountPill}</span>
        ${f.updateStatusHtml}
      </div>
      ${fileHtml ? `<div class="card-path project-file${expanded ? ' expanded' : ''}"${pathAttrs}>${fileText}</div>` : ''}
      ${cardTimes ? `<div class="card-times">${cardTimes}</div>` : ''}
      <div class="card-actions">
        <div class="action-buttons">${schedBtn}${checkBtn}${lifecycle}${editBtn}${convertBtn}</div>
      </div>`;
    wireSchedule(card.querySelector('.sched-btn'), p, f.scheduled);
    wireButton(card.querySelector('.check-btn'), p);
    wireEdit(card.querySelector('.edit-btn'), p);
    card.querySelectorAll('.act-btn').forEach(b => wireAction(b, p, b.dataset.action));
    cards.appendChild(card);
  }
  $('filterSummary').textContent = shown + ' of ' + all.length + ' shown';
  if (!shown) {
    const msg = all.length ? 'No projects match the filters.' : 'No Compose projects found. Start one, import a compose file, or convert a standalone container.';
    tbody.innerHTML = `<tr><td colspan="5" class="muted">${msg}</td></tr>`;
    cards.innerHTML = `<div class="muted">${msg}</div>`;
  }
}

function logProjectHtml(l) {
  const name = l.project || l.file || '';
  const expanded = l.file && expandedPaths.has(l.file);
  const file = l.project && l.file && l.file !== l.project && !l.file.startsWith('container:')
    ? `<span class="log-file${expanded ? ' expanded' : ''}" data-path="${esc(l.file)}" title="${esc(l.file)}">${esc(l.file)}</span>` : '';
  return `<span class="log-project">${esc(name)}${file}</span>`;
}

function renderLogs() {
  const tbody = $('logs'); const cards = $('logsCards');
  tbody.innerHTML = ''; cards.innerHTML = '';
  const logs = state.logs || [];
  if (!logs.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="muted">No checks yet.</td></tr>';
    cards.innerHTML = '<div class="muted">No checks yet.</div>';
    return;
  }
  for (const l of logs) {
    const trig = l.trigger === 'manual'
      ? '<span class="status manual">manual</span>'
      : '<span class="status cron">cron</span>';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="muted">${esc(fmtTime(l.when))}</td>
      <td>${trig}</td>
      <td>${logProjectHtml(l)}</td>
      <td>${updateStatusHtml(l)}</td>
      <td class="muted detail-cell"><div class="detail-inner" data-scrollkey="log-${esc(l.file||l.project)}-${esc(l.when)}">${esc(l.detail || '')}</div></td>`;
    tbody.appendChild(tr);

    const card = document.createElement('div');
    card.className = 'log-card';
    card.innerHTML = `
      <div class="log-card-head">
        ${logProjectHtml(l)}
        ${updateStatusHtml(l)}
      </div>
      <div class="log-card-meta">${trig} · ${esc(fmtTime(l.when))}</div>
      ${l.detail ? `<div class="log-card-detail muted" data-scrollkey="logcard-${esc(l.file||l.project)}-${esc(l.when)}">${esc(l.detail)}</div>` : ''}`;
    cards.appendChild(card);
  }
}

async function saveConfig() {
  const body = {
    cron_schedule: $('cron').value.trim(),
    timezone: $('tz').value.trim(),
    command_timeout: $('timeout').value.trim(),
    auto_update: $('autoUpdate').checked,
    run_on_start: $('runOnStart').checked,
  };
  const r = await fetch('api/config', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (r.ok) { toast('Configuration saved'); load(); } else { toast('Error: ' + await r.text()); }
}

$('saveBtn').addEventListener('click', saveConfig);

$('runBtn').addEventListener('click', dblConfirm($('runBtn'), 'Confirm?', async () => {
  $('runBtn').disabled = true;
  await fetch('api/run', { method: 'POST' });
  toast('Cron run started');
  setTimeout(() => { $('runBtn').disabled = false; load(); }, 1500);
}));

// Check & update every project currently visible under the filters.
$('runFilteredBtn').addEventListener('click', dblConfirm($('runFilteredBtn'), 'Confirm?', async () => {
  const list = currentFilteredProjects().filter(p => p.mounted);
  if (!list.length) { toast('No mounted projects to update'); return; }
  $('runFilteredBtn').disabled = true;
  try {
    const res = await fetch('api/check-many', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ projects: list.map(p => ({ file: p.file, working_dir: p.working_dir, project: p.project })) }) });
    const data = await res.json().catch(() => ({}));
    toast('Updating ' + (data.started != null ? data.started : list.length) + ' project(s)');
    await load();
  } catch (e) {
    toast('Error: ' + e.message);
  } finally {
    $('runFilteredBtn').disabled = false;
  }
}));

// Long compose paths are truncated with an ellipsis. Desktop shows the full
// path in the native title tooltip on hover; on touch devices a tap toggles the
// full path, and the expanded state survives the periodic re-render.
document.addEventListener('click', (e) => {
  const el = e.target.closest('.log-file, .project-file');
  if (!el) return;
  const path = el.getAttribute('data-path');
  if (!path) return;
  if (el.classList.toggle('expanded')) expandedPaths.add(path);
  else expandedPaths.delete(path);
});

['filterUpdate', 'filterCron', 'filterState', 'filterType', 'filterSearch'].forEach(id => {
  $(id).addEventListener('input', () => { if (state) renderProjects(); });
});

// Folder picker for the convert save flow: browse server-side directories
// instead of typing a path.
let dirPickerResolve = null;
let currentDir = '/';
let lastDir = '/';

function pickDirectory(start, title) {
  return new Promise((resolve) => {
    if (dirPickerResolve) dirPickerResolve(null);
    dirPickerResolve = resolve;
    $('dirTitle').textContent = title || 'Choose save folder';
    $('dirWarning').textContent = '';
    $('dirNewRow').hidden = true;
    $('dirNewName').value = '';
    $('dirInfo').textContent = '';
    $('dirList').innerHTML = '<div class="dir-empty">Loading…</div>';
    const dlg = $('dirPicker');
    if (!dlg.open) dlg.showModal();
    loadDir(start || '/');
  });
}

async function loadDir(path) {
  try {
    const res = await fetch('api/browse?path=' + encodeURIComponent(path));
    if (!res.ok) throw new Error(await apiError(res));
    const data = await res.json();
    currentDir = data.path;
    $('dirPath').textContent = data.path;
    $('dirInfo').textContent = data.writable ? 'Files will be saved here' : 'This folder is not writable';
    const list = $('dirList');
    list.innerHTML = '';
    const addRow = (label, target) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'dir-item';
      btn.innerHTML = `<span class="dir-icon">${ICONS.folder}</span><span>${esc(label)}</span>`;
      btn.addEventListener('click', () => {
        $('dirNewRow').hidden = true;
        loadDir(target);
      });
      list.appendChild(btn);
    };
    if (data.parent) addRow('..', data.parent);
    (data.dirs || []).forEach(d => addRow(d.name, d.path));
    if (!data.parent && (!data.dirs || !data.dirs.length)) {
      list.innerHTML = '<div class="dir-empty">No subfolders</div>';
    }
  } catch (e) {
    $('dirWarning').textContent = 'Cannot open folder: ' + e.message;
  }
}

function closeDirPicker(value) {
  $('dirPicker').close();
  if (value) lastDir = value;
  const resolve = dirPickerResolve;
  dirPickerResolve = null;
  if (resolve) resolve(value);
}

$('dirSelect').addEventListener('click', () => closeDirPicker(currentDir));
$('dirNewBtn').addEventListener('click', () => {
  $('dirNewRow').hidden = false;
  $('dirNewName').focus();
});
$('dirNewCreate').addEventListener('click', createDir);
$('dirNewName').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); createDir(); }
});

async function createDir() {
  const name = $('dirNewName').value.trim();
  if (!name) return;
  const btn = $('dirNewCreate');
  btn.disabled = true;
  try {
    const res = await fetch('api/mkdir', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ parent: currentDir, name }) });
    if (!res.ok) throw new Error(await apiError(res));
    const data = await res.json();
    $('dirNewRow').hidden = true;
    $('dirNewName').value = '';
    $('dirWarning').textContent = '';
    await loadDir(data.path);
  } catch (e) {
    $('dirWarning').textContent = 'Create folder failed: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}
$('dirClose').addEventListener('click', () => closeDirPicker(null));
$('dirPicker').addEventListener('click', (e) => {
  if (e.target === $('dirPicker')) closeDirPicker(null);
});

$('importBtn').addEventListener('click', async () => {
  const dir = await pickDirectory(lastDir, 'Choose compose folder');
  if (!dir) return;
  const btn = $('importBtn');
  btn.disabled = true;
  try {
    const res = await fetch('api/import', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ dir }) });
    if (!res.ok) throw new Error(await apiError(res));
    const data = await res.json();
    const files = data.files || [];
    const warnings = data.warnings || [];
    $('scanError').textContent = warnings.join(' · ');
    toast((files.length === 1 ? 'Imported ' + files[0] : 'Imported ' + files.length + ' compose files')
      + (warnings.length ? ' (with warnings)' : ''));
    await load();
  } catch (e) {
    toast('Import failed: ' + e.message);
  } finally {
    btn.disabled = false;
  }
});

async function openConvert(p) {
  try {
    const res = await fetch('api/convert?project=' + encodeURIComponent(p.project || ''));
    if (!res.ok) throw new Error(await apiError(res));
    const data = await res.json();
    editorFile = null;
    editorProject = p.project || '';
    $('editorPath').textContent = (data.suggestedDir || '/tmp/converted/' + p.project) + '/compose.yaml';
    $('editorText').value = data.content || '';
    $('editorText').readOnly = false;
    $('editorSave').disabled = false;
    $('editorInfo').textContent = 'Convert: edit then save to a chosen directory.';
    $('editorWarning').textContent = (data.warnings || []).map(w => '• ' + w).join('\n');
    $('editor').showModal();
    // store suggested dir on save button
    $('editorSave').dataset.dir = data.suggestedDir || '/tmp/converted/' + p.project;
  } catch (e) { toast('Error: ' + e.message); }
}
$('editorClose').addEventListener('click', () => $('editor').close());
$('editorSave').addEventListener('click', saveEditor);
$('editor').addEventListener('click', (e) => {
  if (e.target === $('editor')) $('editor').close(); // click on the backdrop
});

load();
setInterval(load, 5000);
</script>
</body>
</html>
