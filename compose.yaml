services:
  compose-auto-updater:
    # Uses the image published by this repo's GitHub Actions workflow.
    # Override with COMPOSE_AUTO_UPDATER_IMAGE in .env to use a fork/other registry.
    image: ${COMPOSE_AUTO_UPDATER_IMAGE:-ghcr.io/scyslz/docker-compose-updater:latest}
    container_name: compose-auto-updater
    restart: unless-stopped
    ports:
      # Web management UI.
      - "8080:8080"
    environment:
      # Bootstrap settings only. Everything else (scan dirs, cron, toggles…) is
      # edited in the web UI and stored in the config file below.
      # Set WEB_ADDR to "off" to disable the UI.
      WEB_ADDR: ":8080"
      CONFIG_FILE: /config/updater.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent, web-editable configuration. Copy config.example.json here
      # as updater.json to seed the initial values.
      - ./config:/config
      # Mount each host directory at the exact same absolute path used for the
      # include dirs you configure in the UI. Read-only: the updater only scans
      # compose files; Docker changes go through the socket.
      - /data/docker:/data/docker:ro
      - /opt/stacks:/opt/stacks:ro
